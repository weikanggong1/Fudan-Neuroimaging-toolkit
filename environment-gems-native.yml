name: fnit-gems-native
channels:
  - pytorch
  - nvidia
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  - pip>=23
  - pytorch=2.5.1
  - pytorch-cuda=11.8
  - numpy=1.24.3
  - scipy=1.10.1
  - nibabel>=5
  - pybind11=2.13.6
  - libitk=5.4.7
  - libitk-devel=5.4.7
  - gcc_linux-64=11
  - gxx_linux-64=11
  - cmake
  - ninja
  - zlib
  - pip:
      - -e .[gems-native]
