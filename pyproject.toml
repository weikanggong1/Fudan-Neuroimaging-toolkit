[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fudan-neuroimaging-toolkit"
version = "0.10.0"
description = "Standalone PyTorch brain MRI inference with single-subject Python and CLI APIs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "numpy>=1.23,<2",
  "scipy>=1.9",
  "surfa==0.6.3",
  "nibabel>=5",
  "h5py>=3.8",
  "PyYAML>=6",
]

[project.urls]
Repository = "https://github.com/weikanggong1/Fudan-Neuroimaging-toolkit"
Documentation = "https://github.com/weikanggong1/Fudan-Neuroimaging-toolkit#readme"

[project.optional-dependencies]
recon-all-python-stages = ["numba>=0.59", "tifffile>=2023.7", "SimpleITK==2.5.6", "antspyx==0.6.3"]

[project.scripts]
fnit = "fnit.cli:main"
fnit-setup-weights = "fnit.weights:main"
fnit-setup-recon-all-assets = "fnit.recon_all.assets:main"
fnit-recon-all = "fnit.recon_all.standalone:main"
fnit-recon-all-python = "fnit.recon_all.native_free:main"
fnit-normalize = "fnit.recon_all.normalization.pipeline:main"
fnit-normalize-aseg = "fnit.recon_all.normalization.aseg_pipeline:main"
fnit-applywarp = "fnit.applywarp.cli:main"
fnit-flirt = "fnit.flirt.cli:main"
fnit-fnirt = "fnit.fnirt.cli:main"
fnit-mshbm = "fnit.mshbm.cli:main"
fnit-topup = "fnit.topup.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
license-files = ["licenses/*.txt", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.package-data]
fnit = [
  "_vendor_fsl/*.md",
  "_vendor_fsl/*.json",
  "_vendor_fsl/sources/**/*",
  "_vendor_fsl/sources/**/.*",
  "applywarp/*.md",
  "flirt/*.md",
  "fnirt/*.md",
  "synthstrip/*.md",
  "synthmorph/*.md",
  "synthseg_parc/*.md",
  "wmh_synthseg/*.md",
  "synthsr/*.md",
  "fast/*.md",
  "fast/upstream_fast4/*",
  "fast_vbm/*.md",
  "recon_all/*.md",
  "mshbm/*.md",
  "mshbm/assets/*.npz",
  "topup/*.md",
]
