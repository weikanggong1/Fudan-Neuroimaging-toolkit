[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fudan-neuroimaging-toolkit"
version = "0.17.0"
description = "Standalone neuroimaging tools with single-subject Python and CLI APIs"
readme = "README.md"
license-files = ["licenses/*.txt", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "numpy>=1.23,<2",
  "scipy>=1.9",
  "numba>=0.59",
  "nibabel>=5",
  "SimpleITK==2.5.6",
  "h5py>=3.8",
  "PyYAML>=6",
  "Pillow>=9",
  "scikit-learn>=1.5,<2",
  "matplotlib>=3.7",
  "tifffile>=2023.7",
]

[project.urls]
Repository = "https://github.com/weikanggong1/Fudan-Neuroimaging-toolkit"
Documentation = "https://github.com/weikanggong1/Fudan-Neuroimaging-toolkit#readme"

[project.optional-dependencies]
bwas-visualization = ["pyvista>=0.49,<0.50", "vtk>=9.5,<10"]
recon-all-python-stages = ["numba>=0.59", "tifffile>=2023.7", "imagecodecs>=2024.12.30", "nvidia-ml-py==13.580.82"]
connectome-legacy = ["surfa==0.6.3"]

[project.scripts]
FNIT_fslmaths = "fnit.api_cli:FNIT_fslmaths"
FNIT_flirt = "fnit.api_cli:FNIT_flirt"
FNIT_fnirt = "fnit.api_cli:FNIT_fnirt"
FNIT_applywarp = "fnit.api_cli:FNIT_applywarp"
FNIT_convertwarp = "fnit.api_cli:FNIT_convertwarp"
FNIT_invwarp = "fnit.api_cli:FNIT_invwarp"
FNIT_convert_space = "fnit.api_cli:FNIT_convert_space"
FNIT_mmorf = "fnit.api_cli:FNIT_mmorf"
FNIT_SynthStrip = "fnit.api_cli:FNIT_SynthStrip"
FNIT_SynthMorph = "fnit.api_cli:FNIT_SynthMorph"
FNIT_SynthSeg = "fnit.api_cli:FNIT_SynthSeg"
FNIT_SynthSegPlus = "fnit.api_cli:FNIT_SynthSegPlus"
FNIT_SynthSR = "fnit.api_cli:FNIT_SynthSR"
FNIT_WMHSynthSeg = "fnit.api_cli:FNIT_WMHSynthSeg"
FNIT_fslfast = "fnit.api_cli:FNIT_fslfast"
FNIT_fs_segment_subregions = "fnit.api_cli:FNIT_fs_segment_subregions"
FNIT_mri_robust_register = "fnit.api_cli:FNIT_mri_robust_register"
FNIT_recon_all = "fnit.api_cli:FNIT_recon_all"
FNIT_fslvbm = "fnit.api_cli:FNIT_fslvbm"
FNIT_mcflirt = "fnit.api_cli:FNIT_mcflirt"
FNIT_fMRIVolume_pipeline = "fnit.api_cli:FNIT_fMRIVolume_pipeline"
FNIT_fMRISurface_pipeline = "fnit.api_cli:FNIT_fMRISurface_pipeline"
FNIT_newmsm = "fnit.api_cli:FNIT_newmsm"
FNIT_melodic = "fnit.api_cli:FNIT_melodic"
FNIT_mshbm = "fnit.api_cli:FNIT_mshbm"
FNIT_topup = "fnit.api_cli:FNIT_topup"
FNIT_eddy = "fnit.api_cli:FNIT_eddy"
FNIT_dtifit = "fnit.api_cli:FNIT_dtifit"
FNIT_noddi = "fnit.api_cli:FNIT_noddi"
FNIT_bedpostx = "fnit.api_cli:FNIT_bedpostx"
FNIT_probtrackx2 = "fnit.api_cli:FNIT_probtrackx2"
FNIT_dMRIPipeline = "fnit.api_cli:FNIT_dMRIPipeline"
FNIT_UKBconnectomePipeline = "fnit.api_cli:FNIT_UKBconnectomePipeline"
fnit = "fnit.cli:main"
fnit-setup-weights = "fnit.weights:main"
fnit-setup-recon-all-assets = "fnit.recon_all.assets:main"
fnit-recon-all = "fnit.recon_all.native_free:main"
fnit-verify-recon-all-python = "fnit.recon_all.python_runtime:main"
fnit-normalize = "fnit.recon_all.normalization.pipeline:main"
fnit-normalize-aseg = "fnit.recon_all.normalization.aseg_pipeline:main"
fnit-applywarp = "fnit.applywarp.cli:main"
fnit-convertwarp = "fnit.convertwarp.cli:main"
fnit-invwarp = "fnit.invwarp.cli:main"
fnit-flirt = "fnit.flirt.cli:main"
fnit-mcflirt = "fnit.mcflirt.cli:main"
fnit-fnirt = "fnit.fnirt.cli:main"
fnit-robust-register = "fnit.robust_register.cli:main"
fnit-mshbm = "fnit.mshbm.cli:main"
fnit-topup = "fnit.topup.cli:main"
fnit-eddy = "fnit.eddy.cli:main"
fnit-dtifit = "fnit.dtifit.cli:main"
fnit-amico-noddi = "fnit.amico_noddi.cli:main"
fnit-bedpostx = "fnit.bedpostx.cli:main"
fnit-probtrackx = "fnit.probtrackx.cli:main"
fnit-mmorf = "fnit.mmorf.cli:main"
fnit-fslmaths = "fnit.fslmaths.cli:main"
fnit-dmri-pipeline = "fnit.dmri_pipeline.cli:main"
fnit-fmri = "fnit.fmri.cli:main"
fnit-msm = "fnit.msm.cli:main"
fnit-msm-features = "fnit.msm.feature_cli:main"
fnit-bwas = "fnit.bwas.cli:main"
fnit-setup-fmri-surface-assets = "fnit.fmri.assets_setup:main"
fnit-setup-space-assets = "fnit.space_assets:main"
fnit-setup-standard-assets = "fnit.standard_assets:main"
fnit-setup-connectome-atlases = "fnit.connectome.assets:main"
fnit-setup-connectome-native = "fnit.connectome.native_runtime:main"
fnit-space-convert = "fnit.space_conversion:main"
fnit-setup-brainstem-atlas = "fnit.gems.setup:main"
fnit-setup-subregion-atlases = "fnit.gems.setup:subregion_main"
fnit-bigflica = "fnit.bigflica.cli:main"
fnit-superbigflica = "fnit.superbigflica.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fnit = [
  "_release_asset_catalog.json",
  "connectome/atlas_manifest.json",
  "_vendor_fsl/*.md",
  "_vendor_fsl/*.json",
  "_vendor_fsl/sources/**/*",
  "_vendor_fsl/sources/**/.*",
  "applywarp/*.md",
  "convertwarp/*.md",
  "invwarp/*.md",
  "flirt/*.md",
  "mcflirt/*.md",
  "flirt/assets/*.mat",
  "fnirt/*.md",
  "synthstrip/*.md",
  "synthmorph/*.md",
  "synthmorph/*.cpp",
  "synthseg_parc/*.md",
  "synthseg_parc/*.cpp",  # FNIT自有可选CPU columns胶水；CUDA不加载
  "wmh_synthseg/*.md",
  "synthsr/*.md",
  "fast/*.md",
  "fast/upstream_fast4/*",
  "fast_vbm/*.md",
  "recon_all/*.md",
  "recon_all/*.cpp",  # FNIT 自有可选 CPU 平均内核；CUDA 不加载
  "recon_all/*.hpp",  # FNIT 的有限 GCA 评分补丁，供固定源码 Conda 构建使用
  "gems/data/*.txt",
  "mshbm/*.md",
  "mshbm/assets/*.npz",
  "topup/*.md",
  "eddy/*.md",
  "dtifit/*.md",
  "amico_noddi/*.md",
  "amico_noddi/assets/*.npy",
  "amico_noddi/assets/*.bin",
  "fmri/*.md",
  "melodic/*.md",
  "fmri/assets/*.nii.gz",
  "msm/_fastpd_src/*.h",
  "bedpostx/*.md",
  "probtrackx/*.md",
  "connectome/*.md",
  "connectome/*.tsv",
  "connectome/data/*.md",
  "connectome/data/*.npz",
  "connectome/data/*.tsv",
  "mmorf/*.md",
  "dmri_pipeline/*.md",
  "dmri_pipeline/assets/*.cnf",
]

[tool.setuptools.exclude-package-data]
fnit = ["_vendor_fsl/sources/mmorf-0.3.2/*", "_vendor_fsl/sources/mmorf-0.3.2/**/*"]
