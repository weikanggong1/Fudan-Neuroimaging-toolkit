name: fnit
channels:
  - pytorch
  - nvidia
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  - pip>=23
  - cxx-compiler
  - pytorch=2.5.1
  - pytorch-cuda=11.8
  - cuda-version=11.8
  - cuda-nvcc=11.8
  - cuda-cudart-dev=11.8
  - numpy<2
  - scipy>=1.9
  - numba>=0.59
  - statsmodels=0.14.5
  - pandas=2.2.3
  - scikit-learn=1.5.2
  - h5py>=3.8
  - nibabel>=5
  - tifffile>=2023.7
  - imagecodecs>=2024.12.30
  - gcc_linux-64=11
  - gxx_linux-64=11
  - gfortran_linux-64=11
  - cmake
  - ninja
  - make
  - pkg-config
  - patchelf
  - git
  - curl
  - libitk=5.4.7
  - libitk-devel=5.4.7
  - eigen
  - libpng
  - libtiff
  - fftw
  - zlib
  - sysroot_linux-64=2.17=h0157908_18
  - connectome-workbench-cli=2.1.0  # fsLR surface projection
  - matplotlib>=3.7  # ProbtrackX real connectivity comparison figure
  - pyvista>=0.49,<0.50  # BWAS multi-view 3D connectivity plots
  - vtk>=9.5,<10  # PyVista off-screen renderer
  - pillow>=9  # FNIRT/TBSS and MMORF real-data comparison figures
  - pyyaml>=6
  - pip:
      # AMICO 逐体素等价验证使用该 PyPI manylinux wheel 的 OpenBLAS64 构建。
      - "numpy @ https://files.pythonhosted.org/packages/3a/d0/edc009c27b406c4f9cbc79274d6e46d634d139075492ad055e3d68445925/numpy-1.26.4-cp311-cp311-manylinux_2_17_x86_64.manylinux2014_x86_64.whl#sha256=666dbfb6ec68962c033a450943ded891bed2d54e6755e35e5835d63f4f6931d5"
      - triton==3.1.0  # Fused ProbtrackX/FLIRT CUDA kernels; matches PyTorch 2.5.1
      - -e .
